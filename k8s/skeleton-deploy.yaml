apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-skeleton
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-skeleton
  template:
    metadata:
      labels:
        app: node-skeleton
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      # Must exceed SHUTDOWN_TIMEOUT_MS, or the pod is SIGKILLed mid-drain.
      terminationGracePeriodSeconds: 30
      containers:
        - name: service
          image: docker.io/bborbe/node-skeleton:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: LOG_LEVEL
              value: info
            - name: SHUTDOWN_TIMEOUT_MS
              value: '10000'
          # Liveness must NOT check dependencies — a failure restarts the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness may check dependencies — a failure only drains traffic.
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
